name: Deploy POS staging to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pos-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INITIAL_SETUP_TOKEN: ${{ secrets.INITIAL_SETUP_TOKEN }}
      D1_DATABASE: containecoffe
      WORKER_NAME: rebuiled-pos-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          tools: composer:v2

      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$INITIAL_SETUP_TOKEN" || { echo "Missing INITIAL_SETUP_TOKEN secret"; exit 1; }

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist --no-progress

      - name: Test and build
        run: |
          APP_KEY="$(php artisan key:generate --show)" php artisan test --compact
          npm run build

      - name: Verify or initialize D1 schema
        run: |
          php scripts/export-d1-schema.php database/schema/d1-initial.sql
          expected_tables="$(grep -E '^CREATE TABLE ' database/schema/d1-initial.sql | sed -E 's/^CREATE TABLE "([^"]+)".*/\1/' | sort)"
          existing_tables="$(npx wrangler d1 execute "$D1_DATABASE" --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV' ORDER BY name" --json | jq -r '.[0].results[].name' | sort)"

          if [ -z "$existing_tables" ]; then
            npx wrangler d1 execute "$D1_DATABASE" --remote --file=database/schema/d1-initial.sql --yes
          else
            diff -u <(printf '%s\n' "$expected_tables") <(printf '%s\n' "$existing_tables")
            expected_migrations="$(grep -c '^INSERT INTO "migrations"' database/schema/d1-initial.sql)"
            existing_migrations="$(npx wrangler d1 execute "$D1_DATABASE" --remote --command 'SELECT COUNT(*) AS count FROM migrations' --json | jq -r '.[0].results[0].count')"
            setup_rows="$(npx wrangler d1 execute "$D1_DATABASE" --remote --command 'SELECT COUNT(*) AS count FROM setup_state WHERE id = 1' --json | jq -r '.[0].results[0].count')"
            test "$existing_migrations" = "$expected_migrations" || { echo "D1 migration history does not match this app"; exit 1; }
            test "$setup_rows" = "1" || { echo "D1 setup state is missing"; exit 1; }
          fi

      - name: Deploy with the setup wizard locked
        run: |
          npx workersphp deploy \
            --app . \
            --name "$WORKER_NAME" \
            --d1 "$D1_DATABASE" \
            --env APP_TIMEZONE=Asia/Jakarta \
            --env SESSION_DRIVER=cookie \
            --env SESSION_SECURE_COOKIE=true
      - name: Add setup secret and enable the setup wizard
        run: |
          node scripts/patch-workersphp-env.mjs "deployments/$WORKER_NAME/src/index.mjs"

          printf '%s' "$INITIAL_SETUP_TOKEN" | npx wrangler secret put INITIAL_SETUP_TOKEN --config "deployments/$WORKER_NAME/wrangler.jsonc"
          npx wrangler deploy --config "deployments/$WORKER_NAME/wrangler.jsonc"
